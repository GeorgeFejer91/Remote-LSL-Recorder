name: Recorder source and UI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.25.0'
      - name: Locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Pinned recording engine
        shell: pwsh
        run: ./scripts/fetch-labrecorder.ps1
      - name: Source gates
        run: pnpm check
      - name: Rendered controls and companion
        run: pnpm test:ui
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorder-ui-evidence
          path: |
            .for-ai-local/record-and-play/
            .for-ai-local/external-tabs/
            .for-ai-local/panel-sharing/
          if-no-files-found: ignore
